app = "ubiblio-n"
primary_region = "fra"

[build]

[env]
  USE_REDIS = "False"
  DB_LOCATION = "/data/sql_app.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "ubiblio_data"
  destination = "/data"
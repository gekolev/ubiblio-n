{% set hideNav = True %}
{% extends "base.html" %}

{% block main %}
<!-- Banner -->
<!-- Two -->
<section id="two">
	<div class="inner" style = "padding: 20px 0 1em 0;">
		<header class="major">
			<h2>Създаване на акаунт</h2>
		</header>
		{% for error in errors %}
		    <p style="color: red">{{ error }}</p>
		{% endfor %}
		<form action="/auth/create" method="post">
			<p>
			    <p><label for="">Потребителско име</label></p>
			    <input type="text" name="username" value="" required>
			</p>
			<p>
			    <p><label for="">Парола</label></p>
			    <input type="password" name="password" value="" required>
				<input type="hidden" name="accessCode" value="{{ accessCode }}" required>
			</p>
			<input type="submit" value="Изпрати">
		</form>
	</div>				
</section>
{% endblock %}
